%YAML:1.0
---
# C++ / Python 共用。仅启动时读取；滑块修改不写回文件。Mode: 0 红色，1 蓝色。
version: 1
mode: 0
# H: 色相 0~179；S: 饱和度 0~255；V: 明度 0~255。
# 先调 H，再调 s_min 排除灰白，最后调 v_min 排除暗部。
# 漏检：扩大 H 或降低 S/V 下限；误检：缩小 H 或提高 S/V 下限。
# blur=0 关闭；1~10 对应高斯核 3、5、7……21。
# 红色跨越 H 首尾，需要两段；蓝色将两段设相同即可。
red:
   h1_min: 0
   h1_max: 10
   h2_min: 170
   h2_max: 179
   s_min: 100
   s_max: 255
   v_min: 50
   v_max: 255
   blur: 0
blue:
   h1_min: 100
   h1_max: 130
   h2_min: 100
   h2_max: 130
   s_min: 100
   s_max: 255
   v_min: 50
   v_max: 255
   blur: 0
